name: Refresh site indexes and central content

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/data/*.json'
      - 'assets/js/*.js'
      - 'assets/css/*.css'
      - 'service-worker.js'
      - 'offline.html'
      - 'site.webmanifest'
      - 'scripts/*.py'
      - '.github/workflows/refresh-site-indexes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install HTML parser
        run: python -m pip install beautifulsoup4

      - name: Ensure central content data exists
        run: python scripts/migrate_content_data.py

      - name: Synchronize pages from central JSON
        run: python scripts/sync_content_from_data.py

      - name: Generate independent resource pages
        run: python scripts/generate_resource_pages.py

      - name: Optimize generated HTML
        run: python scripts/optimize_html.py

      - name: Refresh statistics, SEO and indexing files
        run: |
          python scripts/generate_site_stats.py
          python scripts/refresh_seo.py
          python scripts/generate_indexing_files.py
          python scripts/validate_site.py

      - name: Commit generated changes when needed
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/*.json sitemap.xml robots.txt site.webmanifest service-worker.js offline.html '*.html' 'pages/*.html' 'levels/**/*.html' 'resources/*.html'
          git commit -m "chore: sync pages from central content data [skip ci]"
          git push
