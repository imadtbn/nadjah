name: Refresh site indexes and statistics

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/*.py'
      - '.github/workflows/refresh-site-indexes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install HTML parser
        run: python -m pip install beautifulsoup4

      - name: Refresh SEO, statistics and indexing files
        run: |
          python scripts/update_stat_markup.py
          python scripts/generate_site_stats.py
          python scripts/refresh_seo.py
          python scripts/generate_indexing_files.py

      - name: Commit generated changes when needed
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/site-stats.json sitemap.xml robots.txt site.webmanifest '*.html'
          git commit -m "chore: refresh site indexes and statistics [skip ci]"
          git push
