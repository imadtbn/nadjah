name: Audit internal links
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair high-confidence stale links
        run: python3 scripts/repair-common-links.py
      - name: Commit safe link repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Repair stale internal subject links"
            git push
          fi
      - name: Audit links and expected pages
        run: python3 scripts/link-audit.py
      - name: Publish summary
        if: always()
        run: |
          if [ -f link-audit-summary.md ]; then cat link-audit-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload detailed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nadjah-link-audit-report
          path: |
            link-audit-report.json
            link-audit-summary.md
          if-no-files-found: warn
