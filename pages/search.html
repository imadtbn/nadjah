                    <option value="">كل المستويات</option>
                </select>
                <select id="subjectFilter" aria-label="المادة">
                    <option value="">كل المواد</option>
                </select>
                <select id="typeFilter" aria-label="نوع المورد">
                    <option value="">كل الأنواع</option>
                    <option value="homework">فروض</option>
                    <option value="exam">اختبارات</option>
                    <option value="exercise">تمارين</option>
                    <option value="revision">مراجعة</option>
                </select>
                <select id="semesterFilter" aria-label="الفصل">
                    <option value="">كل الفصول</option>
                    <option value="1">الفصل الأول</option>
                    <option value="2">الفصل الثاني</option>
